<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ZMetrics</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app">

    <!-- HEADER -->
    <div class="zm-header">
      <div class="zm-title">
        <img src="icons/zmetrics-logo.png"
             class="zm-logo"
             alt="ZMetrics Logo">
      </div>

      <div class="zm-header-actions">
        <button id="refresh-btn">↻</button>
        <button id="settings-btn">⚙</button>
        <button id="account-toggle-btn">👤</button>
      </div>
    </div>

    <!-- ACCOUNT DROPDOWN (secondary, user tab style) -->
    <div id="account-panel" class="account-panel hidden" data-exclusive-panel>
      <!-- Logged out state -->
      <div id="account-logged-out">
        <div class="account-title">Account</div>
        <input
          type="email"
          id="login-email"
          placeholder="Email"
          autocomplete="email"
        />
        <input
          type="password"
          id="login-password"
          placeholder="Password"
          autocomplete="current-password"
        />
        <button id="login-btn">Log in</button>
        <button id="signup-btn" class="account-secondary-btn">
          Sign up on zmetrics.net
        </button>
        <div id="login-error" class="account-error"></div>
      </div>

      <!-- Logged in state -->
      <div id="account-logged-in">
        <div class="account-title">Account</div>
        <div class="account-email-wrapper">
          Signed in as
          <span id="account-email" class="account-email"></span>
        </div>
        <button id="logout-btn">Log out</button>
      </div>
    </div>

    <!-- SETTINGS PANEL -->
    <div id="settings-panel" class="settings-panel hidden" data-exclusive-panel>
      <button id="settings-close-btn" class="settings-close-icon" aria-label="Close settings panel" type="button">×</button>
      <div class="settings-title">Settings</div>

      <!-- ASSETS SECTION -->
      <div class="settings-subtitle">Assets</div>

      <div class="settings-search">
        <input id="search-input" placeholder="Search coin…" />
        <button id="search-btn">Add</button>
      </div>

      <div id="search-results" class="search-results"></div>

      <div id="settings-coins" class="settings-coins-list"></div>

      <!-- SHORTCUT SECTION -->
      <div class="shortcut-section">
        <div class="shortcut-header">
          <span class="shortcut-label">Keyboard shortcut</span>
          <span id="shortcut-display" class="shortcut-display">Ctrl+Shift+Z</span>
        </div>
        <button id="shortcut-change-btn" class="shortcut-change-btn">
          Change shortcut in Chrome…
        </button>
        <div class="shortcut-hint">
          This opens Chrome’s extension shortcut settings so you can choose the key combo to toggle the floating window.
        </div>
      </div>

    </div>

    <!-- TABLE -->
    <div class="zm-table">
      <div class="zm-table-header">
        <div>Asset</div>
        <div>Market Cap</div>
        <div>Price</div>
        <div>24h %</div>
      </div>
      <div id="coins-list" class="zm-table-body"></div>
    </div>

    <div id="update-time" class="timestamp"></div>

    <div class="zm-social-footer">
      <button id="zmetrics-x-link" class="zm-social-link" type="button" aria-label="Open @zmetrics on X">
        <span class="zm-x-icon" aria-hidden="true">𝕏</span>
        <span class="zm-x-handle">@zmetrics</span>
      </button>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
